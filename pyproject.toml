[project]
name = "customer-churn-prediction"
version = "0.1.0"
description = "Customer churn prediction with interpretable ML"
readme = "README.md"
authors = [
    {name = "Anastasiia Matveeva", email = "armatveeeva@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "streamlit>=1.30",
    "joblib>=1.3",
]

[tool.poetry]
name = "customer-churn-prediction"
version = "0.1.0"
packages = [{include = "src"}]

[tool.poetry.group.dev.dependencies]
ruff = "*"
black = "*"
mypy = "*"
pre-commit = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# === Инструменты качества кода ===

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true