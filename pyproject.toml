[tool.poetry]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Production-ready ML pipeline for Telco customer churn prediction with XGBoost, SHAP explainability and Streamlit dashboard"
authors = ["Anastasiia Matveeva <armatveeeva@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pandas = "^2.2.0"
numpy = "^1.26.4"
scikit-learn = "^1.5.0"
xgboost = "^2.1.0"
shap = "^0.46.0"
streamlit = "^1.37.0"
matplotlib = "^3.9.0"
seaborn = "^0.13.2"
joblib = "^1.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
