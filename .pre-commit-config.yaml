exclude: ^(.venv/|venv/|models/|\.git/)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^src/|^app\.py$|^main\.py$
      - id: ruff-format
        files: ^src/|^app\.py$|^main\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: [pandas, types-requests]
        files: ^src/|^app\.py$|^main\.py$